name: Node Inspector Windows

on:
  push:
    branches:
      - main
      - feature/node-inspector-app
    paths:
      - tools/node_inspector_app/**
      - .github/workflows/node-inspector-windows.yml
  pull_request:
    paths:
      - tools/node_inspector_app/**
      - .github/workflows/node-inspector-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    name: Analyze, test, and build Windows
    # Flutter 3.35 does not recognize the Visual Studio 2026-only image that
    # windows-latest currently resolves to. Keep a supported VS 2022 toolchain.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/node_inspector_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true

      - name: Generate standard Windows runner
        run: flutter create --platforms=windows --project-name=node_inspector_app --org=io.nainiugg --no-pub .

      - name: Download and verify isolated scan core
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File prepare_core_windows.ps1

      - name: Verify isolated scan core starts
        run: assets/core/sing-box.exe version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter=expanded

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify Windows release starts and includes scan core
        shell: powershell
        run: |
          $release = Resolve-Path "build/windows/x64/runner/Release"
          $exe = Join-Path $release "node_inspector_app.exe"
          $flutterDll = Join-Path $release "flutter_windows.dll"
          $data = Join-Path $release "data"
          $core = Join-Path $release "data/flutter_assets/assets/core/sing-box.exe"
          $cronet = Join-Path $release "data/flutter_assets/assets/core/libcronet.dll"
          foreach ($required in @($exe, $flutterDll, $data, $core, $cronet)) {
            if (-not (Test-Path $required)) {
              throw "Release is missing required item: $required"
            }
          }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "node_inspector_app.exe exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: node-inspector-windows-v0.6.2
          path: tools/node_inspector_app/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14
